[project]
name = "mflux-inference"
version = "0.1.0"
description = "mflux inference service — FastAPI + MLX"
requires-python = ">=3.12"

# ── Runtime dependencies (mirrors requirements.txt) ────────
dependencies = [
    "mflux>=0.17.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "Pillow>=11.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
]

# ── Dev dependencies (not needed at runtime) ────────────────
[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

# ═══════════════════════════════════════════════════════════
#  Ruff — linter & formatter
# ═══════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF"]
# B008: FastAPI Depends() in function signatures is standard practice
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ═══════════════════════════════════════════════════════════
#  pyright — type checker
# ═══════════════════════════════════════════════════════════
[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
# mflux lib has no type stubs — suppress noise from untyped attributes
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"

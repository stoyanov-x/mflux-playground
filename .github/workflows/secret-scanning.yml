# ══════════════════════════════════════════════════════════════
#  Secret Scanning — TruffleHog
# ══════════════════════════════════════════════════════════════
#  Scans every push and PR for accidentally committed secrets,
#  API keys, tokens, and other sensitive data.
#
#  Runs alongside the main CI pipeline — not a blocker on PRs
#  by default (set fail-on-detection: true to enforce).
# ══════════════════════════════════════════════════════════════

name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Also scan the full git history weekly to catch old leaks.
  schedule:
    - cron: "0 8 * * 1" # every Monday 08:00 UTC

permissions:
  contents: read
  # Needed to post PR comments with findings.
  issues: write
  pull-requests: write

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for deep scan

      - name: Secret Scanning with TruffleHog
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: >-
            --only-verified
            --fail
            --no-update
            --json

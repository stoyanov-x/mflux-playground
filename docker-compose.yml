# ══════════════════════════════════════════════════════════════
#  mflux Experiment — Docker Compose
# ══════════════════════════════════════════════════════════════
#
# ── Why three terminals? ─────────────────────────────────────
# The inference service (mflux + MLX) talks to Apple's Metal GPU
# framework.  Docker for Mac runs a Linux VM which has no access
# to the Metal GPU — so the inference service CANNOT run inside
# Docker on macOS.
#
# ── Local dev workflow (Mac) ─────────────────────────────────
#   Terminal 1 (native):  cd inference-service && uv run uvicorn ...
#   Terminal 2 (Docker):  docker compose up web-api frontend
#   Terminal 3 (Docker):  (optional, can skip if using compose)
#
# ── Cloud deployment (Linux) ─────────────────────────────────
# On a cloud Linux host with an NVIDIA GPU, all three services
# can run in Docker.  Replace inference-service with a CUDA image
# (diffusers, ComfyUI) implementing the same API contract.
#
# ══════════════════════════════════════════════════════════════

services:
  # ── Web API (ASP.NET Core) ─────────────────────────────────
  # Can run in Docker on any platform — no GPU needed.
  web-api:
    build:
      context: ./web-api
      dockerfile: Dockerfile
    ports:
      - "5100:8080"
    environment:
      # Point at the natively-running inference service on the Mac host.
      # macOS: host.docker.internal resolves to the Mac itself.
      # Linux: replace with the actual host IP or service name.
      - InferenceBaseUrl=http://host.docker.internal:8000
      - ASPNETCORE_ENVIRONMENT=Development
    # ── Model weights ────────────────────────────────────────
    # mlx downloads Flux model weights (~25 GB) on first run to
    # ~/.cache/huggingface/.  Docker containers don't share this
    # cache.  So even if MLX *could* run inside Docker on Mac
    # (it can't), you'd re-download the 25 GB every time.
    #
    # ── Persistence ──────────────────────────────────────────
    # Path resolves to /data/mflux_jobs.db inside the container
    # (AppContext.BaseDirectory is /app/, then ../../.. goes to /).
    volumes:
      - mflux_data:/data

  # ── Frontend (Vite + React) ────────────────────────────────
  frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      # Inference API URL. On Mac, host.docker.internal reaches the host.
      # On Linux, replace with the inference service container name or host IP.
      INFERENCE_API_URL: "http://host.docker.internal:8000"
      # Web API URL — always the Docker service name on the internal network.
      WEB_API_URL: "http://web-api:8080"
    depends_on:
      - web-api

volumes:
  mflux_data:
